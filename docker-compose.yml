services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ink_workshop
      POSTGRES_USER: ink
      POSTGRES_PASSWORD: ink
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ink -d ink_workshop"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ink_workshop
      SPRING_DATASOURCE_USERNAME: ink
      SPRING_DATASOURCE_PASSWORD: ink
      INK_INVENTORY_BASE_URL: http://inventory:8081
    ports:
      - "8080:8080"

  inventory:
    build: .
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_CONFIG_NAME: inventory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ink_workshop
      SPRING_DATASOURCE_USERNAME: ink
      SPRING_DATASOURCE_PASSWORD: ink
    ports:
      - "8081:8081"
    entrypoint: ["java", "-Dloader.main=ink.inventory.InventoryApplication", "-cp", "app.jar", "org.springframework.boot.loader.launch.PropertiesLauncher"]
