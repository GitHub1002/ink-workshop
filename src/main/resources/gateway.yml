spring:
  application:
    name: ink-gateway
  config:
    import: optional:classpath:observability.yml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        register-enabled: false
    loadbalancer:
      cache:
        ttl: 3s
    gateway:
      server:
        webmvc:
          routes:
            - id: users
              uri: lb://ink-workshop
              predicates:
                - Path=/users/**
            - id: sessions
              uri: lb://ink-workshop
              predicates:
                - Path=/sessions/**
            - id: orders
              uri: lb://ink-workshop
              predicates:
                - Path=/orders/**
            - id: products
              uri: lb://ink-workshop
              predicates:
                - Path=/products/**
            - id: inventory
              uri: lb://ink-workshop
              predicates:
                - Path=/inventory/**

server:
  port: 8080
