spring:
  application:
    name: ink-inventory
  datasource:
    url: jdbc:postgresql://localhost:5433/ink_inventory
    username: ink
    password: ink
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/inventory
  rabbitmq:
    host: localhost
    port: 5672
    username: ink
    password: ink
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

server:
  port: 8081

ink:
  outbox:
    delay: 1000
