spring:
  application:
    name: ink-inventory
  datasource:
    url: jdbc:postgresql://localhost:5433/ink_inventory
    username: ink
    password: ink
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/inventory

server:
  port: 8081
