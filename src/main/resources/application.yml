spring:
  application:
    name: ink-workshop
  datasource:
    url: jdbc:postgresql://localhost:5433/ink_order
    username: ink
    password: ink
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: localhost
    port: 5672
    username: ink
    password: ink
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms

server:
  port: 8080

ink:
  catalog:
    base-url: http://localhost:8082
    connect-timeout: 1s
    read-timeout: 2s
  inventory:
    base-url: http://localhost:8081
    connect-timeout: 1s
    read-timeout: 2s
  outbox:
    delay: 1000
