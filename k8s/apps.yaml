apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: ink-workshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          image: ink-workshop:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/ink_order
            - name: SPRING_DATASOURCE_USERNAME
              value: ink
            - name: SPRING_DATASOURCE_PASSWORD
              value: ink
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_RABBITMQ_USERNAME
              value: ink
            - name: SPRING_RABBITMQ_PASSWORD
              value: ink
            - name: INK_CATALOG_BASE_URL
              value: http://catalog:8082
            - name: INK_INVENTORY_BASE_URL
              value: http://inventory:8081
            - name: NACOS_SERVER_ADDR
              value: nacos:8848
            - name: NACOS_USERNAME
              value: nacos
            - name: NACOS_PASSWORD
              value: nacos
            - name: INK_ADVERTISE_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT
              value: http://zipkin:9411/api/v2/spans
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: ink-workshop
spec:
  selector:
    app: shop
  ports:
    - port: 8083
      targetPort: 8083
---
