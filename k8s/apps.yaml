apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ink-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ink-workshop:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_CONFIG_NAME
              value: catalog
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/ink_catalog
            - name: SPRING_DATASOURCE_USERNAME
              value: ink
            - name: SPRING_DATASOURCE_PASSWORD
              value: ink
            - name: NACOS_SERVER_ADDR
              value: nacos:8848
            - name: NACOS_USERNAME
              value: nacos
            - name: NACOS_PASSWORD
              value: nacos
            - name: MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT
              value: http://zipkin:9411/api/v2/spans
          command:
            - java
            - -Dloader.main=ink.catalog.CatalogApplication
            - -cp
            - app.jar
            - org.springframework.boot.loader.launch.PropertiesLauncher
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ink-workshop
spec:
  selector:
    app: catalog
  ports:
    - port: 8082
      targetPort: 8082
---
