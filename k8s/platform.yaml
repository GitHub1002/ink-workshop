apiVersion: v1
kind: Namespace
metadata:
  name: ink-workshop
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ink-workshop
data:
  init-databases.sql: |
    CREATE DATABASE ink_catalog;
    CREATE DATABASE ink_inventory;
    CREATE DATABASE ink_order;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ink-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ink_workshop
            - name: POSTGRES_USER
              value: ink
            - name: POSTGRES_PASSWORD
              value: ink
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ink", "-d", "ink_workshop"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ink-workshop
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ink-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: ink
            - name: RABBITMQ_DEFAULT_PASS
              value: ink
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ink-workshop
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: ink-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: nacos/nacos-server:v3.1.1
          ports:
            - containerPort: 8848
            - containerPort: 9848
            - containerPort: 8080
          env:
            - name: MODE
              value: standalone
            - name: NACOS_AUTH_TOKEN
              value: aW5rLXdvcmtzaG9wLW5hY29zLXRva2VuLXNlY3JldC0wMQ==
            - name: NACOS_AUTH_IDENTITY_KEY
              value: ink
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: ink
---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: ink-workshop
spec:
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
    - name: grpc
      port: 9848
      targetPort: 9848
    - name: console
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ink-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports:
            - containerPort: 9411
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: ink-workshop
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
